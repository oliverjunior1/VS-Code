<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio quotations</title>
</head>
<body>
    <!-- Wrap the quote text in a <blockquote> element -->
    <blockquote>Jesus is the light of the world!</blockquote>

    <!-- Add a cite attribute to the blockquote with the value https://www.w3schools.com -->
    <a href="https://www.w3schools.com">W3 Schools</a>
    <br>

    <!-- Wrap the abbreviation HTML in an <abbr> element -->
        <abbr title="Hello">Hello Joaquim!</abbr>

    <!-- Add a title attribute to the abbr with the value Hyper Text Markup Language -->
     
</body>
</html>
